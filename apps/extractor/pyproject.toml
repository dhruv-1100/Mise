[project]
name = "mise-extractor"
version = "0.0.0"
description = "Mise extraction service. Owns all LLM calls, caption fetching, and recipe parsing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "grpcio>=1.68",
    # httpx arrives transitively through google-genai, but app/youtube.py
    # imports it directly, and depending on someone else's dependency graph is
    # how a working build breaks on an unrelated upgrade.
    "httpx>=0.28",
    # The generated stubs in app/gen/ import google.protobuf directly, and it
    # reaches the dev environment only through grpcio-tools, which is a dev
    # dependency used by scripts/codegen.sh. `uv sync --no-dev` in the
    # Dockerfile therefore dropped it, and the container crashed on import with
    # ModuleNotFoundError while every local check passed. Same rule as httpx
    # above: what the code imports, the project declares.
    #
    # >=7.35.1 because extractor_pb2.py calls ValidateProtobufRuntimeVersion
    # with exactly that floor. Regenerating stubs can raise it.
    "protobuf>=7.35.1",
    "pydantic>=2.9",
    "redis>=5.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    # Codegen only — it generates the stubs and never runs in the service.
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# This is an application, not a distributable library — nothing to build or
# install, so uv should not look for a build backend.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# anyio ships the pytest plugin; no extra dependency needed for async tests.
markers = ["anyio: run this test on an anyio event loop"]
filterwarnings = [
    "error",
    # TODO(phase-1): migrate the test client off httpx onto httpx2.
    # Starlette 1.6 deprecated httpx inside TestClient. Downgraded to a visible
    # warning rather than silenced, so it stays a standing TODO instead of
    # disappearing. This is the only permitted exception to warnings-as-errors.
    "default::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Generated by scripts/codegen.sh from packages/schema/extractor.proto.
# Linting it is pointless and FORMATTING it is actively harmful: ruff would
# rewrite the file, and CI's drift check compares the tree against fresh
# codegen output — so a reformatted stub would fail that check on every run
# with no way to fix it short of undoing the formatting.
extend-exclude = ["app/gen"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors — includes E722, the bare-except ban
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the entire point of a test file.
"tests/**" = ["S101"]
# RUF001/002/003 flag characters that look like ASCII lookalikes. Normalizing
# exactly those characters — styled unicode, fraction glyphs, U+2044 FRACTION
# SLASH — is what this module does and what its tests exercise, so the lookalikes
# are the subject matter rather than a mistake.
"app/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"app/extract.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_normalize.py" = ["S101", "RUF001", "RUF002", "RUF003"]
