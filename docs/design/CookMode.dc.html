<style>
    :root{
      --ground:oklch(0.982 0.008 78);
      --surface:oklch(0.962 0.012 76);
      --sunk:oklch(0.930 0.016 74);
      --line:oklch(0.876 0.018 72);
      --ink:oklch(0.235 0.018 55);
      --ink-soft:oklch(0.478 0.020 60);
      --ink-faint:oklch(0.628 0.018 65);
      --accent:oklch(0.565 0.168 42);
      --accent-deep:oklch(0.455 0.150 40);
      --accent-wash:oklch(0.945 0.032 48);
      --herb:oklch(0.565 0.168 148);
      --herb-wash:oklch(0.948 0.030 150);
      --warn:oklch(0.565 0.168 82);
      --warn-wash:oklch(0.952 0.040 86);
      /* Text tier. Matched oklch lightness makes accent/herb/warn perceptually
         even, but WCAG luminance is not perceptual lightness, so herb and warn
         land at 4.01:1 and 4.37:1 on ground — under the 4.5 small text needs.
         The matched trio stays for fills and icons (3:1); text uses these. */
      --herb-text:oklch(0.500 0.168 148);
      --warn-text:oklch(0.495 0.168 82);
      --cook-ground:oklch(0.185 0.014 55);
      --cook-surface:oklch(0.245 0.016 55);
      --cook-ink:oklch(0.966 0.010 80);
      --cook-ink-soft:oklch(0.760 0.014 70);
      --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:999px;
      --shadow:0 1px 2px oklch(0.235 0.018 55 / 0.06), 0 8px 24px oklch(0.235 0.018 55 / 0.06);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--ground);color:var(--ink);
      font-family:Manrope,ui-sans-serif,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--accent-deep);text-decoration:none;}
    a:hover{color:var(--accent);}
    .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;}
    .phone{width:390px;min-height:844px;background:var(--ground);
      display:flex;flex-direction:column;position:relative;overflow:hidden;}
    .pad{padding:0 20px;}
    .tap{min-height:44px;min-width:44px;}
    .eyebrow{font-size:12px;font-weight:600;letter-spacing:0.09em;
      text-transform:uppercase;color:var(--ink-faint);}
</style>

><div style="margin-top:26px;background:var(--cook-surface);border-radius:var(--r-lg);padding:18px 20px;"><div style="font-size:13px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--cook-ink-soft);margin-bottom:12px;">You will need</div><div style="font-size:20px;line-height:1.5;">3 cups whole wheat flour</div><div style="font-size:20px;line-height:1.5;">3 potatoes, boiled and grated</div><div style="font-size:20px;line-height:1.5;">1&frac12; tsp chilli powder</div></div><div style="margin-top:20px;display:flex;align-items:center;gap:12px;background:var(--cook-surface);border-radius:var(--r-lg);padding:16px 20px;"><span style="color:var(--accent);flex:none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg></span><div style="flex:1;"><div style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;">00:30</div><div style="font-size:13px;color:var(--cook-ink-soft);">per side</div></div><button class="tap" style="border:0;border-radius:var(--r-md);background:var(--accent);color:var(--cook-ground);height:44px;padding:0 20px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">Start</button></div></div><div style="display:flex;gap:12px;padding:20px 20px 34px;flex:none;"><button class="tap" style="width:76px;height:60px;border-radius:var(--r-md);border:1px solid var(--cook-surface);background:transparent;color:var(--cook-ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><polyline points="11 18 5 12 11 6"></polyline></svg></button><button class="tap" style="flex:1;height:60px;border:0;border-r
